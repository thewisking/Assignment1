<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Textification</title>

        <link rel="icon" href="/icons/logo.png">
        <link rel="stylesheet" href="/css/styles.css">

        <script type="module" src="/js/recording.js"></script>
    </head>

    <body>

        <header>
            <img class="icon" src="/icons/logo.png" alt="Textification logo">
            <h1>Textification</h1>
        </header>

        <main class="wrapper">

            <section class="recording-panel">

                <div id="sound-visualiser" class="hud-visualiser">

                    <div class="hud-header">
                        <span>MIC INPUT // ANALYSIS</span>
                        <span id="recording-indicator">STANDBY</span>
                    </div>

                    <canvas id="audio-canvas" width="900" height="260" aria-label="Live microphone waveform">
                    </canvas>

                </div>

                <p id="recording-status" aria-live="polite">
                    Ready to record
                </p>

                <div class="recording-controls">
                    <button id="record-button" type="button">
                        Start recording
                    </button>
                </div>

                <section class="transcription-section">
                    <h2>Transcription</h2>

                    <output id="transcription-output">
                        Your transcription will appear here.
                    </output>
                </section>

            </section>

        </main>

        <footer>
            <p class="footer-text">Textification speech-to-text application</p>
        </footer>

    </body>

</html>
